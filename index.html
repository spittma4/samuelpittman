<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel Pittman - Senior Software Engineer</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-neutral-50 dark:bg-neutral-900 text-neutral-900 dark:text-neutral-100 transition-colors duration-200">
  <div id="app" x-data="{
    activeSection: 'header',
    darkMode: localStorage.getItem('darkMode') === 'true',
    toggleDarkMode() {
      this.darkMode = !this.darkMode;
      localStorage.setItem('darkMode', this.darkMode);
      if (this.darkMode) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }
  }"
  x-init="
    if (darkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  ">

    <!-- Dark Mode Toggle -->
    <div x-html="DarkModeToggle()"></div>

    <!-- Header Section -->
    <div x-html="Header()"></div>

    <!-- About Section -->
    <div x-html="About()"></div>

    <!-- Projects Section -->
    <div x-html="Projects()"></div>

    <!-- Work Experience Section -->
    <div x-html="Work()"></div>

    <!-- Education Section -->
    <div x-html="Education()"></div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
